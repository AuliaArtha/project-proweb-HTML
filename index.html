<!DOCTYPE html>
<html lang="id">
<head>
    <title>Restoran Jepang - Autentik & Lezat</title>
    <meta name="description" content="Nikmati aneka hidangan restoran Jepang autentik dan lezat untuk Anda dan keluarga.">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Title -->
    <h1>Restoran Jepang</h1>

    <div class="menu-container">
        <!-- Ramen Section -->
        <div class="menu-card">
            <img src="https://images.unsplash.com/photo-1569718212165-3a8278d5f624?w=500" alt="Ramen Shoyu">
            <div class="menu-info">
                <h2>Ramen Shoyu</h2>
                <p>Ramen khas Jepang dengan kuah kaldu shoyu yang gurih, disajikan dengan mi kenyal, chashu, dan telur ajitama.</p>
                <p class="price">Rp 50.000</p>
            </div>
        </div>

        <!-- Salmon Sushi Section -->
        <div class="menu-card">
            <img src="https://images.unsplash.com/photo-1579871494447-9811cf80d66c?w=500" alt="Salmon Sushi">
            <div class="menu-info">
                <h2>Salmon Sushi Platter</h2>
                <p>Potongan sushi salmon segar berkualitas tinggi dengan nasi sushi berbumbu khas, cocok untuk pencinta seafood.</p>
                <p class="price">Rp 75.000</p>
            </div>
        </div>
    </div>
</body>
</html>
